# ====================================================================
# UCAD / FST / LACGAA - M2 TDSI (Pr. Demba SOW)
# Configuration Spring Boot - Application Cryptographie Java
# ====================================================================

spring.application.name=crypto-java-backend
server.port=8080

# --------------------------------------------------------------------
# Configuration Base de données MySQL
# --------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/crypto_tdsi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# spring.datasource.url=jdbc:h2:mem:crypto_tdsi_db;DB_CLOSE_DELAY=-1
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver

# --------------------------------------------------------------------
# JPA / Hibernate
# --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------------------
# Gestion des Téléversements de Fichiers (Chiffrement / Hachage / Sign)
# --------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --------------------------------------------------------------------
# Configuration JWT (Sécurité des tokens d'authentification)
# --------------------------------------------------------------------
crypto.jwt.secret=TDSI_UCAD_MASTER2_CRYPTO_JAVA_PR_DEMBA_SOW_SECRET_KEY_2026_SECURITY_TOKEN_512BITS_HEX
crypto.jwt.expiration-ms=86400000

# --------------------------------------------------------------------
# Répertoire de Stockage Local des Clés et Fichiers (Exigence C://MTDSI ou local)
# --------------------------------------------------------------------
crypto.storage.directory=C:/MTDSI

# --------------------------------------------------------------------
# Actuator / Prometheus Monitoring
# --------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}